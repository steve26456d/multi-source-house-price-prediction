# ============================================================
# 多源数据融合挖掘——房价预测
# conda 环境配置
# ============================================================
# 安装方式: conda env create -f environment.yaml
# 激活环境: conda activate house-price-fusion
# 更新环境: conda env update -f environment.yaml --prune

name: house-price-fusion
channels:
  - pytorch
  - conda-forge
  - defaults

dependencies:
  # ========================
  # 核心 Python
  # ========================
  - python=3.10

  # ========================
  # 数据处理
  # ========================
  - pandas>=2.0.0
  - numpy>=1.24.0
  - scipy>=1.10.0

  # ========================
  # 机器学习
  # ========================
  - scikit-learn>=1.3.0
  - xgboost>=2.0.0

  # ========================
  # 深度学习
  # ========================
  - pytorch>=2.0.0
  - transformers>=4.30.0

  # ========================
  # 文本处理
  # ========================
  - spacy>=3.6.0
  - nltk>=3.8.0

  # ========================
  # 可视化
  # ========================
  - matplotlib>=3.7.0
  - seaborn>=0.12.0
  - plotly>=5.14.0

  # ========================
  # 工具
  # ========================
  - pyyaml>=6.0
  - tqdm>=4.65.0
  - joblib>=1.3.0
  - click>=8.1.0

  # ========================
  # Jupyter & 开发
  # ========================
  - jupyter>=1.0.0
  - ipykernel>=6.25.0

  # ========================
  # pip 依赖（conda 无对应包时使用）
  # ========================
  - pip
  - pip:
      - python-dotenv>=1.0.0
      - optuna>=3.0.0
      - tokenizers>=0.13.0
      - pytest>=7.4.0
      - pytest-cov>=4.1.0
