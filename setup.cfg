# ============================================================
# 项目元数据与工具配置
# ============================================================

[metadata]
name = house-price-fusion
version = 0.1.0
description = 多源数据融合挖掘——房价预测
author = 孙钰淼, 陈晓英, 石韫嘉, 潘志强
license = MIT

[options]
packages = find:
python_requires = >=3.10

[tool:pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
addopts = -v --tb=short --strict-markers

[flake8]
max-line-length = 100
exclude = .git,__pycache__,build,dist,.venv,venv
ignore = E203, W503

[isort]
profile = black
line_length = 100
